name: Release Base-* Docker image

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target base image"
        type: choice
        options:
          - base-server
          - base-builder
          - base-admin-tools
          - base-ci-builder
        required: true
      commit:
        description: "Commit sha to build from"
        required: true
      tag:
        description: "New tag for the image"
        required: true
      arch:
        description: "Platform architecture"
        type: choice
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
          - linux/arm64
        required: true
        default: linux/amd64,linux/arm64

jobs:
  build-push-images:
    runs-on: ubuntu-latest-16-cores
    steps:
      - name: Checkout repository
        uses: actions/checkout@e2f20e631ae6d7dd3b768f56a5d2af784dd54791 # v2.5.0
        with:
          ref: ${{ github.event.inputs.commit }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Metatags for the image
        id: meta
        uses: docker/metadata-action@b2391d37b4157fa4aa2e118d643f417910ff3242 # v3.8.0
        with:
          images: temporalio/${{ github.event.inputs.target }}
          tags: ${{ github.event.inputs.tag }}

      - name: Build-Push Base-* image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          push: true
          pull: true
          file: docker/base-images/${{ github.event.inputs.target }}.Dockerfile
          platforms: ${{ github.event.inputs.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
